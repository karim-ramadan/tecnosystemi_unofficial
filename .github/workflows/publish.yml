name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    name: Bump version, tag & publish
    runs-on: ubuntu-latest

    permissions:
      contents: write   # push commit + tag
      id-token: write   # OIDC trusted publisher (no API token needed)

    environment:
      name: pypi
      url: https://pypi.org/p/tecnosystemy-unofficial

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so we can push tags

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Bump version in pyproject.toml
        run: uv version --bump ${{ inputs.bump }}

      - name: Read new version
        id: version
        run: echo "value=$(uv version --short)" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "chore: bump version to ${{ steps.version.outputs.value }}"

      - name: Create and push tag
        run: |
          git tag "v${{ steps.version.outputs.value }}"
          git push origin HEAD --follow-tags

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
